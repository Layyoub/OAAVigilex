services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigilex}
      POSTGRES_USER: ${POSTGRES_USER:-vigilex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilex} -d ${POSTGRES_DB:-vigilex}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilex}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vigilex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vigilex}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-64-random-characters}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"

volumes:
  postgres_data:
